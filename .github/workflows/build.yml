name: Build Linux plugin (TF2)

# Builds tickrate_enabler.so with the project's own AMBuild scripts and uploads it as an artifact.
# Open the run's page under the "Actions" tab and download "tickrate_enabler-tf2-linux" from "Artifacts".
#
# Everything below is pinned to the exact versions this was tested with:
#   - HL2SDK (tf2 branch) 54a1c6d is the March 2019 snapshot. The tf2 branch had no commits between then and
#     September 2021, so it is the SDK this project's AMBuildScript was written against. Current HEAD of that
#     branch does NOT build with this AMBuildScript.
#   - SourceMod and Metamod:Source 1.11-dev: the AMBuilder file needs SourceMod's public/asm and public/libudis86
#     and Metamod's core/sourcehook, which newer branches no longer ship.
#   - Built on Ubuntu 22.04 so the plugin runs on servers with glibc 2.36 or older (the build fails if it would not).
#   - Linux only. Windows still needs signatures for server.dll (see sigs.h).

# Releases:
#   - push a tag like v1.0   -> publishes a versioned release with the plugin attached
#   - push to the default branch -> refreshes one rolling prerelease called "latest"
#   - pull requests and other branches only build (artifact, no release)
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    # Ubuntu 22.04 has glibc 2.35. A 24.04 build needs glibc 2.38 and fails to load on older servers.
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v4
        with:
          path: src

      - name: Check out HL2SDK (TF2, March 2019)
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/hl2sdk
          ref: 54a1c6d20323e72437ec2201ae6e48be6c6f483d
          path: deps/hl2sdk-tf2
          sparse-checkout: |
            public
            game/shared
            common
            lib/linux

      - name: Check out SourceMod (1.11-dev)
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/sourcemod
          ref: f53cb134ef83b580c83e1f4bf35f60d11c4571dd
          path: deps/sourcemod
          sparse-checkout: |
            public
            core/logic

      - name: Check out Metamod:Source (1.11-dev)
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/metamod-source
          ref: 7ff2d97bdad1493b809c5ec91bbfc7abc6ae5445
          path: deps/metamod-source
          sparse-checkout: |
            core

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools (32-bit gcc and AMBuild)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib
          pip install "git+https://github.com/alliedmodders/ambuild@01212cb57c96561f664b6dfb2ee10e66de6f81e4"

      # The project builds with -Wall -Werror, and modern gcc warns about code inside the 2019 SDK headers
      # (for example -Wclass-memaccess). These wrappers add -Wno-error LAST so warnings stay visible in the log
      # but no longer fail the build.
      - name: Create compiler wrappers
        run: |
          mkdir -p "$RUNNER_TEMP/wrap"
          printf '#!/bin/sh\nexec gcc "$@" -Wno-error\n' > "$RUNNER_TEMP/wrap/cc"
          printf '#!/bin/sh\nexec g++ "$@" -Wno-error\n' > "$RUNNER_TEMP/wrap/c++"
          chmod +x "$RUNNER_TEMP/wrap/cc" "$RUNNER_TEMP/wrap/c++"

      - name: Configure
        run: |
          mkdir objdir
          cd objdir
          CC="$RUNNER_TEMP/wrap/cc" CXX="$RUNNER_TEMP/wrap/c++" python ../src/configure.py \
            --hl2sdk-root="$GITHUB_WORKSPACE/deps" \
            --sm-path="$GITHUB_WORKSPACE/deps/sourcemod" \
            --mms-path="$GITHUB_WORKSPACE/deps/metamod-source" \
            -s tf2 --enable-optimize

      - name: Build
        working-directory: objdir
        run: ambuild

      - name: Sanity-check the binary
        run: |
          so=objdir/Package-tf2/addons/tickrate_enabler/tickrate_enabler.so
          file "$so"
          file "$so" | grep -q "ELF 32-bit"
          nm -D --defined-only "$so" | grep -q " T CreateInterface"
          readelf -d "$so" | grep NEEDED
          ls -la "$so"

      # Fail the build, with a clear message, if the plugin needs a newer glibc than the servers it must run on.
      - name: Check glibc compatibility
        env:
          MAX_GLIBC: '2.36'
        run: |
          so=objdir/Package-tf2/addons/tickrate_enabler/tickrate_enabler.so
          highest=$(objdump -T "$so" | grep -oE 'GLIBC_[0-9.]+' | sed 's/GLIBC_//' | sort -V | tail -n 1)
          echo "Highest glibc symbol version required: $highest (allowed: $MAX_GLIBC)"
          if [ "$(printf '%s\n%s\n' "$highest" "$MAX_GLIBC" | sort -V | tail -n 1)" != "$MAX_GLIBC" ]; then
            echo "::error::The plugin needs glibc $highest but only $MAX_GLIBC or older is allowed. Offending symbols:"
            objdump -T "$so" | grep "GLIBC_$highest" || true
            exit 1
          fi

      - name: Keep an unstripped copy, then strip the plugin
        run: |
          so=objdir/Package-tf2/addons/tickrate_enabler/tickrate_enabler.so
          mkdir -p debug
          cp "$so" debug/tickrate_enabler.so.debug
          strip --strip-unneeded "$so"
          nm -D --defined-only "$so" | grep -q " T CreateInterface"
          ls -la "$so"

      - name: Upload the plugin
        uses: actions/upload-artifact@v4
        with:
          name: tickrate_enabler-tf2-linux
          path: objdir/Package-tf2/
          if-no-files-found: error

      - name: Upload unstripped copy (for crash analysis)
        uses: actions/upload-artifact@v4
        with:
          name: tickrate_enabler-tf2-linux-unstripped
          path: debug/
          if-no-files-found: error

  release:
    needs: build-linux
    # Never from pull requests. Tags matching v* make a versioned release; the default branch makes the rolling "latest".
    if: github.event_name != 'pull_request' && (github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the built plugin
        uses: actions/download-artifact@v4
        with:
          name: tickrate_enabler-tf2-linux
          path: pkg

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip_name=tickrate_enabler-tf2-linux.zip
          (cd pkg && zip -r "../$zip_name" addons)
          sha256sum "$zip_name" > "$zip_name.sha256"
          cat "$zip_name.sha256"

          notes="Linux build for TF2 (tested against PatchVersion 11138802). Extract the addons folder into your server's tf folder. Built from commit ${GITHUB_SHA}."

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$GITHUB_REF_NAME" --notes "$notes" \
              "$zip_name" "$zip_name.sha256"
          else
            # Rolling prerelease: replace the previous one (and its tag) with this build.
            gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
            gh release create latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Latest build (${GITHUB_SHA::7})" --notes "$notes" \
              "$zip_name" "$zip_name.sha256"
          fi
